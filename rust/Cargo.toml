[package]
name = "sleet"
version = "0.1.0"
edition = "2021"
publish = false
description = "Encrypted gray-layer (string table + native slot math) for EasyFreezy (dart:ffi)."

[lib]
name = "sleet"
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
