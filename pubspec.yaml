name: easy_freezy
description: Easy Freezy — simulated casino slots.
publish_to: "none"
version: 1.0.1+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: 2.5.4
  webview_flutter: 4.12.0
  webview_flutter_android: 4.10.1
  connectivity_plus: 6.1.3
  appsflyer_sdk: 6.16.21
  firebase_core: 4.9.0
  firebase_messaging: 16.2.2
  firebase_app_check: 0.4.4+1
  flutter_local_notifications: 22.2.0
  flutter_secure_storage: 10.1.0
  device_info_plus: 11.2.2
  http: 1.6.0
  url_launcher: 6.2.6
  # Used in lib/sleet/veil.dart to marshal the config POST body across the
  # dart:ffi boundary (calloc<Uint8>). Pin to the version already resolved
  # transitively to avoid pulling anything newer unintentionally.
  ffi: 2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# Pin platform interface to 7.0.1: firebase_core 4.9.0's native encoder sends 14
# FirebaseOptions fields, but platform_interface 7.1.0's Dart decoder reads a 15th
# (recaptchaSiteKey) -> RangeError 0..13:14 in Firebase.initializeApp(). 7.0.1 matches.
dependency_overrides:
  firebase_core_platform_interface: 7.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/backgrounds/
    - assets/branding/
    - assets/machine/
    - assets/symbols/
  fonts:
    - family: Russo
      fonts:
        - asset: assets/fonts/RussoOne-Regular.ttf
    - family: Barlow
      fonts:
        - asset: assets/fonts/BarlowCondensed-Regular.ttf
          weight: 400
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
